<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: light dark;
      --accent: #0060df;
      --muted: #5b5b66;
    }
    @media (prefers-color-scheme: dark) {
      :root { --accent: #00ddff; --muted: #bfbfc9; }
    }
    body {
      width: 252px;
      margin: 0 auto;
      padding: 12px;
      box-sizing: border-box;
      font: 13px/1.4 system-ui, sans-serif;
    }
    .hdr { display: flex; align-items: center; justify-content: space-between; margin: 0 0 8px; }
    h1 { font-size: 13px; font-weight: 600; margin: 0; }
    #opts {
      border: 0; background: transparent; color: var(--muted, #5b5b66);
      padding: 3px; margin: -3px; cursor: pointer; border-radius: 5px;
      display: inline-flex; line-height: 0;
    }
    #opts:hover { color: var(--accent, #0060df); background: color-mix(in srgb, currentColor 10%, transparent); }
    #opts svg { width: 15px; height: 15px; }
    #search {
      width: 100%;
      box-sizing: border-box;
      padding: 5px 8px;
      margin: 0 0 8px;
      font: 12.5px system-ui, sans-serif;
      border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
      border-radius: 6px;
      background: transparent;
      color: inherit;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      max-height: 190px;
      overflow-y: auto;
    }
    button.chip {
      padding: 5px 2px;
      font: 12.5px system-ui, sans-serif;
      border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
      border-radius: 6px;
      background: transparent;
      color: inherit;
      cursor: pointer;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    button.chip:hover { border-color: var(--accent); }
    @media (pointer: coarse) {
      body { width: auto; max-width: 400px; padding: 14px; }
      button.chip { padding: 9px 4px; font-size: 13.5px; }
      #action { padding: 11px; font-size: 14px; }
    }
    button.chip.selected {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    #status {
      min-height: 17px;
      margin: 10px 0 8px;
      opacity: .75;
    }
    #status.error { color: #d70022; opacity: 1; }
    #action {
      width: 100%;
      padding: 8px;
      font: 600 13px system-ui, sans-serif;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    #action.restore { background: #1ba45c; }
    #action:disabled { opacity: .55; cursor: default; }
  </style>
</head>
<body>
  <div class="hdr">
    <h1 id="title"></h1>
    <button id="opts" title=""></button>
  </div>
  <input id="search" type="search" autocomplete="off">
  <div class="grid" id="langs"></div>
  <div id="status"></div>
  <button id="action"></button>
  <script src="langs.js"></script>
  <script src="popup.js"></script>
</body>
</html>
