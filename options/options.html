<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Always Translate</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font: 14px/1.5 system-ui, sans-serif;
      margin: 0 auto;
      padding: 20px;
      max-width: 560px;
      color: var(--txt);
      --txt: #15141a;
      --muted: #5b5b66;
      --border: color-mix(in srgb, currentColor 22%, transparent);
      --accent: #0060df;
      background: #fff;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #1c1b22; --txt: #fbfbfe; --muted: #bfbfc9; --accent: #00ddff; }
    }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
    .search {
      width: 100%; box-sizing: border-box; padding: 9px 12px;
      font: 14px system-ui, sans-serif;
      border: 1px solid var(--border); border-radius: 8px;
      background: transparent; color: inherit;
      margin-bottom: 12px;
    }
    .search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    .lang-list { border: 1px solid var(--border); border-radius: 8px; overflow-y: auto; max-height: 60vh; }
    label.lang {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 14px; cursor: pointer;
      border-bottom: 1px solid var(--border);
    }
    label.lang:last-child { border-bottom: 0; }
    label.lang:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
    label.lang input { accent-color: var(--accent); width: 15px; height: 15px; }
    label.lang .native { flex: 1; }
    label.lang .code { color: var(--muted); font-size: 12px; }
    label.lang.selected { background: color-mix(in srgb, var(--accent) 14%, transparent); }
    label.lang.selected .native { font-weight: 600; }
    .current-line { margin: 14px 2px 0; font-size: 13px; color: var(--muted); }
    .current-line b { color: inherit; }
  </style>
</head>
<body>
  <h1>Always Translate</h1>
  <p class="sub" id="sub"></p>
  <input class="search" id="search" type="search" autocomplete="off">
  <div class="lang-list" id="langs"></div>
  <p class="current-line" id="current-line"></p>
  <script src="../popup/langs.js"></script>
  <script src="options.js"></script>
</body>
</html>
